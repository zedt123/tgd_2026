name: edm_image
model_config:
  precond:
    type: VP
  net:
    net_name: OGDhariwalUNet
    ckpt_path: model_weights/ffhq_10m.pt
    img_resolution: 256
    in_channels: 3
    model_channels: 128
    num_res_blocks: 1
    attention_resolutions: 16
    channel_mult: ""
    learn_sigma: True
    label_dim: 0
    num_heads: 4
    num_head_channels: 64
    use_scale_shift_norm: True
    resblock_updown: True
