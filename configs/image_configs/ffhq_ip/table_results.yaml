# @package _global_

out_dir: neurips_2026/ffhq_ip_samples
device: cuda
save_images: false
save_traj: false

eval:
  paired_metrics: ["psnr", "lpips", "ssim"]
  paired_metric_kwargs:
    lpips:
      batch_size: 64
    psnr:
      data_range: 1.0
    consistency_mse:
      reduction: mean

  dist_metrics: []
  dist_metric_kwargs: {}

defaults:
  - /data: ffhq
  - /model: ffhq256
  - /sampler: ffhq_ip/mpgd_tgd # fallback default; algorithm-specific values below can override this
  - /operator: large_resolution/inpaint_box
  - _self_

run:
  total_data: 100
  num_particles: 1      # fallback default; algorithm-specific values below can override this
  batch_size: 16
  device: cuda
  seed: 3
  save_traj: false
  traj_steps: 1
  particles_to_save: 1

pick:
  top_k: 5
  rank_metric: lpips                  # lpips | psnr
  rank_pair: ["DAPS-4", "A-TGD"]        # names of the two algorithms used to rank images
  gap_mode: abs                       # check both sides

algorithms:
  - name: DPS
    sweep_kind: mpgd                  
    num_particles: 1
    sweep_value: 596
    selection_rule: first             # first | measurement_best | best_lpips | best_psnr
    overrides:
      - sampler=ffhq_ip/dps_daps

  - name: DAPS
    sweep_kind: outer_inner
    num_particles: 1
    sweep_value: 1196
    selection_rule: first
    overrides:
      - sampler=ffhq_ip/mcmc_daps

  - name: DAPS-4
    sweep_kind: outer_inner
    num_particles: 4
    sweep_value: 308
    selection_rule: measurement_best
    overrides:
      - sampler=ffhq_ip/mcmc_daps

  - name: TGD
    sweep_kind: outer_inner
    num_particles: 4
    sweep_value: 324
    selection_rule: measurement_best
    overrides:
      - sampler=ffhq_ip/mpgd_tgd_10

  - name: A-TGD
    sweep_kind: atgd
    num_particles: 4
    sweep_value: 512
    selection_rule: first
    overrides:
      - sampler=ffhq_ip/mpgd_atgd

outputs:
  root_config_yaml: results_config.yaml
  summary_json: results_summary.json