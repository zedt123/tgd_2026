name: atgd
kwargs:
  ess_threshold: 1.0
  stop: 0.5

process_schedule:
  name: edm
  kwargs: { num_steps: 256, t_max: 100.0, t_min: 0.1, rho: 7.0 }

annealing:
  name: uniform
  kwargs: { num_steps: 256, beta_min: 0.0, beta_max: 1.0 }

x0_solver:
  schedule:
    name: edm
    kwargs: { num_steps: 4, t_max: 100.0, t_min: 0.01, rho: 7.0 }
  drift:
    name: mpgd
    kwargs: {}
  solver:
    name: euler_maruyama
    kwargs: {}

diffusion_params:
  lam: 0.0

x0_modifier:
  name: identity
  kwargs: {}

forward_process:
  name: edm
  kwargs: {}
